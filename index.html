<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IP Location Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>🌐 IP Location Finder</h1>
    <p>Find approximate location information for an IP address.</p>
    <input id="ipInput" type="text" placeholder="Enter IP (example: 8.8.8.8)">
    <button onclick="findIP()">Find Location</button>
    <div id="result" class="result">Enter an IP address above.</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
